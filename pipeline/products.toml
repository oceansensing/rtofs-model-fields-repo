# What this repository publishes: sea surface height and ice (global), surface temperature and salinity (US East), from NOAA's Global RTOFS in the
# open-data bucket `noaa-nws-rtofs-pds` — published, not drawn on the
# website's map (the owner, 2026-09-27). The fetcher is the site's
# `scripts/fetch-rtofs.py`, shared with `rtofs-model-currents-repo` and scoped here with `--only=`.
#
# **Option A** of the 2026-09-27 survey: the global surface files carry sea
# surface height and the ice, and not temperature, salinity or currents,
# which come here from the regional US East subset (0 to 80 N, 105 to 41 W).
# Global roots are 0.25 degree from 0 E; US East roots 0.08 degree with
# `regional: true`. Sizes measured 2026-09-27, 4-7 MB a root.
#
# **The budget.** One 00Z cycle a day; its forecast hours f000-f071 land
# about 13:00 UTC. Each run publishes the frame nearest now — hourly for the
# global roots, six-hourly for US East — on a schedule every six hours: at
# most three hours off when published, plus six to the next run and
# GitHub's lateness. 12 hours; re-measure after a week.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

# **Two days ahead and one behind** (2026-11-22, DECISIONS D3; the site
# pipeline's D16): `hours_ahead` and `hours_behind` are each product's window,
# its dated files R2's alone and kept there while a base lists them. The base
# is read first and the hours added inside ten minutes of a step; a step has
# thirty, since one request gives up after eleven.
[defaults]
timeout_minutes = 30

# **A step a product** (2026-11-14), each named for the product it makes and
# scoped to it. A step's exit is the fate of every product it makes, and as
# one step for all eight, one product's refusal held them all: on 2026-11-14
# a single cell under the near-bottom temperature's floor held every product
# for two runs. One lane, so the steps ask NOAA's bucket one at a time, in
# this order, and each reads only what its own product needs (the
# near-bottom's read the US East file's levels, 4 s a variable when measured).
[steps.ssh-rtofs]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=ssh-rtofs"]
lane = "noaa-rtofs-bucket"

[steps.sic-rtofs]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=sic-rtofs"]
lane = "noaa-rtofs-bucket"

[steps.sit-rtofs]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=sit-rtofs"]
lane = "noaa-rtofs-bucket"

[steps.sst-rtofs-useast]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=sst-rtofs-useast"]
lane = "noaa-rtofs-bucket"

[steps.sss-rtofs-useast]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=sss-rtofs-useast"]
lane = "noaa-rtofs-bucket"

[steps.nearbottomt-rtofs-useast]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=nearbottomt-rtofs-useast"]
lane = "noaa-rtofs-bucket"

[steps.nearbottoms-rtofs-useast]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=nearbottoms-rtofs-useast"]
lane = "noaa-rtofs-bucket"

[steps.nearbottomdepth-rtofs-useast]
cmd = ["python3", "scripts/fetch-rtofs.py", "--only=nearbottomdepth-rtofs-useast"]
lane = "noaa-rtofs-bucket"

[products.ssh-rtofs]
title = "RTOFS sea surface height"
step = "ssh-rtofs"
roots = ["ssh-rtofs.json"]
writes = ["ssh-rtofs.json", "ssh-rtofs.v*.json"]
r2_only = ["ssh-rtofs.v*.json"]
memory = "r2-kept"
hours_ahead = 48
hours_behind = 24
max_age_hours = 12
namespace = ["python3", "scripts/fetch-rtofs.py", "--namespace", "--only=ssh-rtofs"]

[products.sic-rtofs]
title = "RTOFS sea ice concentration"
step = "sic-rtofs"
roots = ["sic-rtofs.json"]
writes = ["sic-rtofs.json", "sic-rtofs.v*.json"]
r2_only = ["sic-rtofs.v*.json"]
